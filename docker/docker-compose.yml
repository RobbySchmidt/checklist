# Directus 11 + Postgres 16 für ein Projekt.
# Der Compose-Projektname ist kein Literal, sondern kommt aus COMPOSE_PROJECT_NAME in docker/.env
# (Compose liest die .env neben dieser Datei automatisch). Fehlt die Variable, bricht Compose mit einer
# Meldung ab – sonst würde der Ordnername „docker" zum Projektnamen und ALLE Projekte aus diesem Starter
# teilten sich Container und Datenbank-Volume (docker_database). Mit eigenem Namen bekommt jedes Projekt
# eigene Container und ein eigenes Volume (<projekt>_database). Anlegen: `yarn setup --name <slug>`.
# Die `:?`-Guards bei den Secrets verhindern, dass Postgres/Directus mit leeren Werten starten.

name: "${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME fehlt in docker/.env – bitte 'yarn setup --name <slug>' ausführen}"

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      # Named Volume statt Bind-Mount – vermeidet Rechteprobleme unter Windows/WSL2
      - database:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${DB_USER:?DB_USER fehlt in docker/.env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD fehlt in docker/.env}"
      POSTGRES_DB: "${DB_DATABASE:?DB_DATABASE fehlt in docker/.env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  directus:
    image: directus/directus:11
    restart: unless-stopped
    ports:
      # Host-Port pro Projekt (docker/.env), im Container immer 8055
      - "${DIRECTUS_PORT:-8055}:8055"
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
    depends_on:
      database:
        condition: service_healthy
    environment:
      SECRET: "${DIRECTUS_SECRET:?DIRECTUS_SECRET fehlt in docker/.env}"

      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:?DB_DATABASE fehlt in docker/.env}"
      DB_USER: "${DB_USER:?DB_USER fehlt in docker/.env}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD fehlt in docker/.env}"

      # Erst-Admin wird nur beim allerersten Start angelegt
      ADMIN_EMAIL: "${ADMIN_EMAIL:?ADMIN_EMAIL fehlt in docker/.env}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD fehlt in docker/.env}"

      # Muss zum Host-Port passen (Asset-URLs, Login-Redirects) – Default folgt DIRECTUS_PORT
      PUBLIC_URL: "${DIRECTUS_PUBLIC_URL:-http://localhost:${DIRECTUS_PORT:-8055}}"

      # Nuxt-Dev-Server darf die API ansprechen
      CORS_ENABLED: "true"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000}"

volumes:
  database:
